<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シユ的个人站</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Special Elite', monospace;
        }

         #base-layer {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('./img/2.jpg') no-repeat center center;
    background-size: cover;
    z-index: 1;
}
        .binary-code {
            position: fixed;
            color: #00008B; 
            font-weight: bold; 
            font-size: 14pt; 
            font-family: 'Special Elite', monospace; 
            pointer-events: none;
            animation: superFastFlash 0.3s steps(1) forwards;
        }

        #mask-layer {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('./img/1.png') no-repeat center center;
    background-size: cover;
    z-index: 20;
    pointer-events: none;
}

 #title-image {
    position: fixed;

    top: 4%;
    left: 64%;

    transform: translateX(-50%);

    width: 720px;
    height: auto;

    z-index: 8;

    pointer-events: none;

    mix-blend-mode: multiply;
}
        @keyframes superFastFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .nav-btn {
            position: fixed;
            height: 195px; 
            width: auto;
            cursor: pointer;
            z-index: 100;
            display: none; 
            transition: transform 0.2s ease;
        }
        .nav-btn:hover { transform: scale(1.1); }

        .sub-page {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none; overflow-y: scroll;
            z-index: 2000; 
            text-align: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        
        /* 核心修改：宽度设为50%，保持1cm间隔 */
        .sub-page img { 
            width: 50%; 
            height: auto; 
            display: block; 
            margin: 0 auto 1cm auto; 
            position: relative; 
            z-index: 5; 
        }

       .back-btn {
    position: fixed;
    top: 40px;
    left: 40px;

    color: #ffffff;
    background: none;
    border: none;

    cursor: pointer;
    font-size: 2.2em;
    font-weight: bold;

    z-index: 3000;

    transition: color 0.2s;
}

.back-btn:hover {
    color: #00008B;
}
    </style>
</head>
<body>

    <audio id="audio1" src="./img/1.mp3" loop></audio>
    <audio id="audio2" src="./img/2.mp3" loop></audio>

 <div id="base-layer"></div>

 <img id="title-image" src="./img/title.png">

 <div id="mask-layer"></div>
  

    <img src="./img/4.png" id="btn1" class="nav-btn" onclick="showPage('page1')">
    <img src="./img/5.png" id="btn2" class="nav-btn" onclick="showPage('page2')">
    <img src="./img/7.png" id="btn4" class="nav-btn" onclick="showPage('page4')">

    <div id="page1" class="sub-page"><div class="back-btn" onclick="hidePage()">BACK</div><div id="content1"></div></div>
    <div id="page2" class="sub-page"><div class="back-btn" onclick="hidePage()">BACK</div><div id="content2"></div></div>
    <div id="page4" class="sub-page"><div class="back-btn" onclick="hidePage()">BACK</div><div id="content4"></div></div>

<script>
    let isFirstReturn = true;
    let codeEnabled = true;
    const a1 = document.getElementById('audio1');
    const a2 = document.getElementById('audio2');
    let activeRects = [];

    function checkOverlap(newRect) {
        const padding = 20; 
        for (let rect of activeRects) {
            if (!(newRect.right + padding < rect.left || 
                  newRect.left - padding > rect.right || 
                  newRect.bottom + padding < rect.top || 
                  newRect.top - padding > rect.bottom)) {
                return true; 
            }
        }
        return false;
    }

    function manageBtn(btnId) {
        const btn = document.getElementById(btnId);
        function cycle() {
            const isAnySubPageOpen = Array.from(document.querySelectorAll('.sub-page')).some(p => p.style.display === 'block');
            if (!isAnySubPageOpen) {
                let foundSpot = false;
                let attempts = 0;
                let left, top, rect;
                while (!foundSpot && attempts < 50) {
                    left = Math.random() * (window.innerWidth - 300) + 50; 
                    top = Math.random() * (window.innerHeight - 250) + 50;
                    rect = { id: btnId, left, top, right: left + 250, bottom: top + 195 };
                    if (!checkOverlap(rect)) foundSpot = true;
                    attempts++;
                }
                if (foundSpot) {
                    activeRects.push(rect);
                    btn.style.left = left + 'px';
                    btn.style.top = top + 'px';
                    btn.style.display = 'block';
                    setTimeout(() => {
                        btn.style.display = 'none';
                        activeRects = activeRects.filter(r => r.id !== btnId);
                        setTimeout(cycle, Math.random() * 2000 + 3000);
                    }, 1000);
                } else {
                    setTimeout(cycle, 1000);
                }
            } else {
                btn.style.display = 'none';
                setTimeout(cycle, 1000);
            }
        }
        cycle();
    }

    manageBtn('btn1'); manageBtn('btn2'); manageBtn('btn4');

    function spawnCode() {
        if (!codeEnabled) return;
        const span = document.createElement('span');
        span.className = 'binary-code';
        span.innerText = Math.round(Math.random());
        span.style.left = Math.random() * 98 + 'vw';
        span.style.top = Math.random() * 98 + 'vh';
        const activeSubPage = Array.from(document.querySelectorAll('.sub-page')).find(p => p.style.display === 'block');
        if (activeSubPage) {
            span.style.zIndex = "1"; 
            activeSubPage.appendChild(span);
        } else {
            span.style.zIndex = "10";
            document.body.appendChild(span);
        }
        setTimeout(() => span.remove(), 300);
    }
    setInterval(spawnCode, 50);

    function showPage(id) {
        a2.pause(); a2.currentTime = 0; 
        a1.play().catch(e => {});
        document.querySelectorAll('.nav-btn').forEach(b => b.style.display = 'none');
        activeRects = []; 
        document.getElementById(id).style.display = 'block';
        document.getElementById(id).scrollTop = 0;
    }

    function hidePage() {
        const pages = document.querySelectorAll('.sub-page');
        pages.forEach(p => p.style.display = 'none');
        a1.pause(); 
        const base = document.getElementById('base-layer');
        if (isFirstReturn) {
            base.style.backgroundImage = "url('./img/1.jpg')";
            codeEnabled = false; isFirstReturn = false;
            a2.play().catch(e => {}); 
        } else {
            if (Math.random() > 0.5) {
                base.style.backgroundImage = "url('./img/2.jpg')";
                codeEnabled = true; a2.pause(); a2.currentTime = 0;
            } else {
                base.style.backgroundImage = "url('./img/1.jpg')";
                codeEnabled = false; a2.play().catch(e => {}); 
            }
        }
    }

    function insertImgs(containerId, start, end) {
        const container = document.getElementById(containerId);
        for (let i = start; i <= end; i++) {
            const img = document.createElement('img');
            img.src = `./img/${i}.jpg`;
            container.appendChild(img);
        }
    }
    insertImgs('content1', 3, 16); insertImgs('content2', 17, 33);
    insertImgs('content4', 43, 56); 
</script>
</body>
</html>
