<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
  margin: 0;
  background: #666;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* 三图布局 */
.grid {
  display: flex;
  gap: 20px;
}

/* 正方形蒙版 */
.box {
  width: 180px;
  height: 180px;
  overflow: hidden;
  background: #333;
  position: relative;
  cursor: pointer;
  transition: transform 0.25s ease;
}

/* hover效果 */
.box:hover {
  transform: scale(1.08);
}

/* 图片强制填满正方形 */
.box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.25s ease;
}

/* hover时稍微提亮 */
.box:hover img {
  filter: brightness(1.15);
}
</style>
</head>

<body>

<div class="grid">

  <div class="box">
    <img src="./img/1.jpg">
  </div>

  <div class="box">
    <img src="./img/2.png">
  </div>

  <div class="box">
    <img src="./img/3.png">
  </div>

</div>

</body>
</html>
